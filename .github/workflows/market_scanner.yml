name: BASANI Market Scanner

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "0,30 0-12 * * 1-5"
    - cron: "0,30 21-23 * * 1-5"
    - cron: "0,30 * * * 0,6"
  workflow_dispatch: {}

concurrency:
  group: market-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run BASANI scanner (UW-only)
        env:
          UW_TOKEN: ${{ secrets.UW_TOKEN }}
        run: python3 run_all.py

      - name: Checkout data repo (for pushing)
        uses: actions/checkout@v4
        with:
          repository: dabsanddollars2024-cpu/basani-data
          path: data-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push data to public data repo
        run: |
          set -e
          git config --global user.name  "BASANI Bot"
          git config --global user.email "bot@basani.ai"

          # Push all JSONs that the dashboard reads from
          # Note: grades.json lives in sumedhbasani/Basani (separate repo) - skipped here
          cp -f scan_output.json data.json news.json unusual_whales.json \
                calendar.json gex_data.json data-repo/ 2>/dev/null || true
          cp -f plays.json plays_log.json uw_conviction.json \
                scan_output_v2.json data-repo/ 2>/dev/null || true

          cd data-repo
          git add -f scan_output.json data.json news.json unusual_whales.json calendar.json gex_data.json scan_output_v2.json uw_conviction.json plays.json plays_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "PUSH OK"
          fi
