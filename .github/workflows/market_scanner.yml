name: BASANI Market Scanner

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "0,30 0-12 * * 1-5"
    - cron: "0,30 21-23 * * 1-5"
    - cron: "0,30 * * * 0,6"
  workflow_dispatch: {}

concurrency:
  group: market-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run BASANI scanner
        env:
          ALPACA_KEY:      ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:   ${{ secrets.ALPACA_SECRET }}
          X_BEARER_TOKEN:  ${{ secrets.X_BEARER_TOKEN }}
          UW_TOKEN:        ${{ secrets.UW_TOKEN }}
          BENZINGA_KEY:    ${{ secrets.BENZINGA_KEY }}
          MASSIVE_KEY:     ${{ secrets.MASSIVE_KEY }}
        run: python3 run_all.py

      - name: Push data to public data repo
        run: |
          set -e
          git config --global user.name  "BASANI Bot"
          git config --global user.email "bot@basani.ai"
          git config --global init.defaultBranch main

          # Use built-in GITHUB_TOKEN provided by GH Actions automatically
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/dabsanddollars2024-cpu/basani-data.git /tmp/basani-data

          cp -f data.json news.json unusual_whales.json calendar.json grades.json /tmp/basani-data/
          cp -f scan_output.json plays.json plays_log.json /tmp/basani-data/ 2>/dev/null || true

          cd /tmp/basani-data
          git add -f data.json news.json unusual_whales.json calendar.json grades.json scan_output.json plays.json plays_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "PUSH OK"
          fi