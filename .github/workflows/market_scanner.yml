name: BASANI Market Scanner

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "0,30 0-12 * * 1-5"
    - cron: "0,30 21-23 * * 1-5"
    - cron: "0,30 * * * 0,6"
  workflow_dispatch: {}

concurrency:
  group: market-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run BASANI scanner
        env:
          ALPACA_KEY:      ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:   ${{ secrets.ALPACA_SECRET }}
          X_BEARER_TOKEN:  ${{ secrets.X_BEARER_TOKEN }}
          UW_TOKEN:        ${{ secrets.UW_TOKEN }}
          BENZINGA_KEY:    ${{ secrets.BENZINGA_KEY }}
          MASSIVE_KEY:     ${{ secrets.MASSIVE_KEY }}
        run: python3 run_all.py

      - name: Push data to public data repo
        run: |
          git config user.name  "BASANI Bot"
          git config user.email "bot@basani.ai"
          
          # Clone the public data repo (empty)
          git clone https://github.com/sumedhbasani/basani-data.git /tmp/basani-data
          
          # Copy data files to the data repo
          cp -f data.json news.json unusual_whales.json calendar.json grades.json /tmp/basani-data/
          cp -f scan_output.json plays.json plays_log.json /tmp/basani-data/ 2>/dev/null || true
          
          cd /tmp/basani-data
          git add -f data.json news.json unusual_whales.json calendar.json grades.json scan_output.json plays.json plays_log.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" || git commit -m "auto: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push